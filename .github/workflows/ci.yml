name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check  # the plugin starts with uv run --locked
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      # the lock carries mcp 2; the same suite against the oldest mcp 1 we allow
      - run: uv run --isolated --with "mcp==1.21.1" --group dev pytest -q
