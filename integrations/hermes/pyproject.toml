[project]
name = "hermes-hypruse"
version = "0.1.0"
description = "hypruse as a computer-use provider for Hermes Agent on Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ilyas Khallouki", email = "khalloukielias@gmail.com" }]
keywords = ["hermes", "hyprland", "computer-use", "wayland", "accessibility"]
# None: the provider runs the hypruse CLI (0.13 or newer) as a separate program,
# and it imports Hermes, which provides itself.
dependencies = []

[project.urls]
Homepage = "https://github.com/IlyasKhallouki/hypruse/tree/main/integrations/hermes"

# Hermes has no entry point for computer-use providers: it loads them from
# $HERMES_HOME/plugins/<name>/. This command links the installed package there.
[project.scripts]
hermes-hypruse = "hermes_hypruse_install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hermes_hypruse", "hermes_hypruse_install.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
